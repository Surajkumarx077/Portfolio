<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Suraj Kumar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Devicon for logos -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="dark-theme">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <section class="skills-list-section">
            <div class="container">
                <div class="skills-header slide-up">
                    <span class="section-badge">&mdash; SKILLS</span>

                <hr class="skills-divider slide-up">

                <!-- LANGUAGES -->
                <div class="skills-row slide-up-delay-1">
                    <div class="skills-category-info">
                        <h2 class="skills-title">LANGUAGES</h2>
                    </div>
                    <div class="skills-items">
                        <div class="skill-item glass-panel">
                            <i class="devicon-java-plain colored"></i>
                            <span>Java</span>
                        </div>
                        <div class="skill-item glass-panel">
                            <i class="devicon-python-plain colored"></i>
                            <span>Python</span>
                        </div>
                        <div class="skill-item glass-panel">
                            <i class="devicon-mysql-plain colored"></i>
                            <span>SQL</span>
                        </div>
                    </div>
                </div>

                <hr class="skills-divider slide-up-delay-1">

                <!-- FRONTEND -->
                <div class="skills-row slide-up-delay-3">
                    <div class="skills-category-info">
                        <h2 class="skills-title">FRONTEND</h2>
                    </div>
                    <div class="skills-items">
                        <div class="skill-item glass-panel">
                            <i class="devicon-html5-plain colored"></i>

                            <i class="devicon-css3-plain colored"></i>

                            <span>React</span>
                        </div>
                    </div>
                </div>

                <hr class="skills-divider slide-up-delay-3">

                <div class="skills-row slide-up-delay-2">
                    <div class="skills-category-info">
                        <h2 class="skills-title">BACKEND</h2>
                    </div>
                    <div class="skills-items">
                        <div class="skill-item glass-panel">
                            <i class="devicon-spring-original colored"></i>
                            <span>Spring Boot</span>
                        </div>
                        <div class="skill-item glass-panel">
                            <i class="devicon-spring-original colored"></i>
                            <span>Spring MVC</span>
                        </div>
                        <div class="skill-item glass-panel">
                            <i class="devicon-nodejs-plain colored"></i>
                            <span>REST API</span>
                        </div>
                        <div class="skill-item glass-panel">
                            <i class="devicon-spring-original colored"></i>
                            <span>Spring Security</span>
                        </div>
                        <div class="skill-item glass-panel">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                                </path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>

                <hr class="skills-divider slide-up-delay-2">

                <div class="skills-row slide-up-delay-4">
                    <div class="skills-category-info">
                        <h2 class="skills-title">DATABASES</h2>
                    </div>
                    <div class="skills-items">
                        <div class="skill-item glass-panel">
                            <i class="devicon-mysql-original colored"></i>

                    </div>

                <hr class="skills-divider slide-up-delay-4">

                        <div class="skill-item glass-panel">

                            <span>GitHub</span>

                            <i class="devicon-docker-plain colored"></i>

    <script src="../js/theme.js"></script>
    <script src="../js/navbar.js"></script>

    <script src="../js/main.js"></script>
