<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education | Suraj Kumar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/education.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="dark-theme">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <section class="education-section">
            <div class="container">
                <h1 class="section-title slide-up-delay-1">Academic <span class="text-gradient">Journey</span></h1>
                <p class="section-subtitle slide-up-delay-1">My academic background...</p>
                
                <hr class="education-divider slide-up-delay-1">

                <div class="timeline slide-up-delay-2">
                    <div class="timeline-item">
                        <div class="timeline-row">
                            <div class="timeline-year">2023-2027</div>
                            <div class="timeline-category">Undergraduate</div>
                        </div>
                        <div class="timeline-divider">
                            <div class="timeline-dot"></div>
                            <div class="timeline-line"></div>
                        </div>
                        <div class="timeline-details glass-panel">
                            <h4 class="timeline-subtitle">B.Tech in CSE</h4>
                            <p class="timeline-desc">LNCT University</p>
                        </div>
                    </div>
                    
                    <div class="timeline-item">
                        <div class="timeline-row">
                            <div class="timeline-year">2020-2022</div>
                            <div class="timeline-category">Senior Secondary</div>
                        </div>
                        <div class="timeline-divider">
                            <div class="timeline-dot"></div>
                            <div class="timeline-line"></div>
                        </div>
                        <div class="timeline-details glass-panel">
                            <h4 class="timeline-subtitle">LND College, Motihari(Bihar)</h4>
                        </div>
                    </div>
                    
                    <div class="timeline-item">
                        <div class="timeline-row">
                            <div class="timeline-year">2019-2020</div>
                            <div class="timeline-category">Secondary</div>
                        </div>
                        <div class="timeline-divider">
                            <div class="timeline-dot"></div>
                            <div class="timeline-line" style="display: none;"></div>
                        </div>
                        <div class="timeline-details glass-panel">
                            <h4 class="timeline-subtitle">UMS Beldarwa,  Adapur(Bihar)</h4>
                        </div>
                    </div>
                </div>

                <hr class="education-divider slide-up-delay-3">

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/theme.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
